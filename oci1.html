<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Доска Оцифровщиков</title>
  <link rel="stylesheet" href="oci.css"> <!-- Убрал слэш в начале, если файлы в одной папке -->
</head>
<body>
  <h1 style="color: #ff6600;">Доска Оцифровщиков (НЕ ДОДЕЛАНА UPD: 21/10/2026)</h1>
  <a href="/" class="smooth-button-link">На Главную</a>

  <div id="gallery-container"></div>
  
  <script>
    const galleryData = [
      { image: "/oci/logos/shpintv.jpg", url: "https://t.me/dmitrovvhs" },
      { image: "/oci/logos/ekbtvrec.jpg", url: "https://t.me/ekbtvrec" },
      { image: "/oci/logos/yar_zam.jpg", url: "https://t.me/YaroslavzamytinVHS" },
      { image: "/oci/logos/sp1.jpg", url: "https://t.me/spl_vhs" }, // Проверьте: было spl.jpg, исправил на sp1.jpg как раньше
      { image: "/oci/logos/west.jpg", url: "https://t.me/jops2286_vhs" },
      { image: "/oci/logos/tvold.jpg", url: "https://t.me/tvoldchanneltg#" },
      { image: "/oci/logos/tvglor.jpg", url: "https://t.me/tvgloris" },
      { image: "/oci/logos/shib.jpg", url: "https://t.me/buttercupsVHS" }, // Проверьте: было shib.jpg
      { image: "/oci/logos/kosta.jpg", url: "https://t.me/gffrdt_archive" },
      { image: "/oci/logos/retrik.jpg", url: "https://t.me/simon_vhs" },
      { image: "/oci/logos/timvhs.jpg", url: "https://t.me/timvhs74channel" }, // Исправил опечатку chanal -> channel
      { image: "/oci/logos/maxim.jpg", url: "https://vk.com/vhsmchk11" },
      { image: "/oci/logos/anton.gif", url: "https://t.me/noiceplumz" },
      { image: "/oci/logos/igor.jpg", url: "https://t.me/cheriksofttv" },
      { image: "/oci/logos/kuzn.jpg", url: "#" },
      { image: "/oci/logos/rashn.jpg", url: "#" },
      { image: "/oci/logos/kirll_a.k.jpg", url: "https://t.me/mrcatmann_vhs" }, // Убрал пробел в имени файла (пробелы в URL могут ломать загрузку)
      { image: "/oci/logos/mark.jpg", url: "https://t.me/markreuditonline" },
      { image: "/oci/logos/ip.png", url: "https://www.youtube.com/@voxpopuli6709" }, // <-- ДОБАВИЛ ЗАПЯТУЮ ЗДЕСЬ
      { image: "/oci/logos/beeper.jpg", url: "https://t.me/BEEPER_VHS_ARCHIVE" }
    ];

    const container = document.getElementById('gallery-container');

    galleryData.forEach((item, index) => {
      // Создаем ссылку
      const link = document.createElement('a');
      link.href = item.url;
      // Добавляем оба класса, чтобы работали и качание, и всплывающая подсказка из CSS
      link.className = 'sway-image-link link-with-preview'; 
      link.setAttribute('data-preview', item.url.replace('https://', '').replace('http://', '')); // Текст для подсказки
      
      if(item.url.startsWith('http')) {
        link.target = "_blank"; 
      }

      // Создаем картинку
      const img = document.createElement('img');
      img.src = item.image; 
      img.alt = `Картинка ${index + 1}`;

      // Собираем всё вместе
      link.appendChild(img);
      container.appendChild(link);
    });
  </script>
</body>
</html>
